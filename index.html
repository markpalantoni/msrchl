<!doctype html><html lang=en><head>
<meta charset=utf-8>
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name=apple-mobile-web-app-capable content=yes>
<meta name=apple-mobile-web-app-status-bar-style content=black>
<title>Ms Rachel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#12101a;color:#f4f1ea;
  font:16px/1.4 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;overscroll-behavior:none}
#pick{padding:24px;display:none}
#pick.on{display:block}
h1{font-size:26px;font-weight:700;margin-bottom:4px}
.sub{opacity:.55;font-size:15px;margin-bottom:22px}
.mins{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.chip{flex:1;min-width:74px;padding:18px 0;border-radius:18px;border:2px solid #2f2b3d;
  background:#1b1826;font-size:21px;font-weight:700;color:#f4f1ea;text-align:center}
.chip.sel{background:#f0b429;border-color:#f0b429;color:#2a1f00}
.chip.test{font-size:16px;opacity:.75}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{border:0;padding:0;background:#1b1826;border-radius:16px;overflow:hidden;text-align:left;color:inherit}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#241f33}
.card span{display:block;padding:10px 12px;font-size:13px;line-height:1.35;opacity:.85}
.big{width:100%;margin-bottom:14px;padding:22px;border-radius:20px;border:0;
  background:#f0b429;color:#2a1f00;font-size:22px;font-weight:800}
#stage{position:fixed;inset:0;display:none;background:#000}
#stage.on{display:block}
#yt{position:absolute;inset:0;width:100%;height:100%;transition:opacity 6s ease-in-out}
#tap{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;background:#12101a;z-index:20;padding:30px;text-align:center;border:0;color:#f4f1ea;width:100%}
#tap.on{display:flex}
#tap .play{width:132px;height:132px;border-radius:50%;background:#f0b429;color:#2a1f00;
  font-size:54px;display:flex;align-items:center;justify-content:center;padding-left:10px}
#tap b{font-size:25px}#tap small{opacity:.5;font-size:15px;max-width:22em}
#bye{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:18px;background:#12101a;opacity:0;pointer-events:none;
  transition:opacity 2.4s ease-in;text-align:center;padding:30px;z-index:10}
#bye.on{opacity:1;pointer-events:auto}
#bye .wave{font-size:76px;animation:w 2.2s ease-in-out infinite}
@keyframes w{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(18deg)}}
#bye p{font-size:27px;font-weight:700}#bye small{opacity:.5;font-size:15px}
#again{margin-top:26px;padding:15px 30px;border-radius:16px;border:2px solid #2f2b3d;
  background:transparent;color:#f4f1ea;font-size:15px}
#veil{position:absolute;inset:0;z-index:3;background:transparent}
#clk{position:fixed;top:0;right:0;z-index:5;border:0;background:transparent;
  padding:16px 20px;min-width:96px;min-height:58px;color:#fff;
  font:600 17px/1 ui-monospace,SFMono-Regular,monospace;text-align:right}
#clk span{display:inline-block;padding:6px 11px;border-radius:11px;
  background:#0009;opacity:0;transition:opacity .25s}
#clk.on span{opacity:.8}
#dbg{position:fixed;left:0;right:0;bottom:0;z-index:99;background:#000c;color:#7f8;
  font:11px/1.5 ui-monospace,monospace;padding:7px 10px;display:none;white-space:pre-wrap}
#dbg.on{display:block}
</style></head><body>
<div id=pick>
  <h1>Ms Rachel</h1>
  <div class=sub>Pick how long, then pick a video.</div>
  <div class=mins id=mins></div>
  <button class=big id=surprise>Surprise me</button>
  <div class=grid id=grid></div>
</div>
<button id=tap><div class=play>&#9654;</div><b id=tapt>Tap to start</b><small id=taps></small></button>
<div id=stage>
  <div id=yt></div>
  <div id=veil></div>
  <button id=clk><span>--:--</span></button>
  <div id=bye>
    <div class=wave>&#128075;</div>
    <p>All done!<br>Bye bye, Ms Rachel.</p>
    <small>See you next time.</small>
    <button id=again>Grown-ups: start again</button>
  </div>
</div>
<div id=dbg></div>
<script>
const VIDEOS = [
  {id:"7K6YSmf0HdU", t:"Baby Music Class (full class)", len:"31:03"},
  {id:"bIWT6RCMk-o", t:"Teaching Toddlers In and Out Through Play & Song", len:"6:23"},
  {id:"oLw8KBBjc9E", t:"Toddler Music Class 2", len:"31:12"},
  {id:"WbpKj0F-Z3s", t:"Farm Animal Sounds for Toddlers", len:"7:26"},
  {id:"Ok1rDrnxh0A", t:"Kids Music Class - full class", len:"30:06"},
  {id:"ZA9DTkaR6ao", t:"Letter Sounds Phonics Song + more", len:"35:47"},
  {id:"CWxH4evJY5g", t:"Kids Music Class Online", len:"25:38"},
  {id:"ZcX0gl-NFFg", t:"ABCs, Colors, Letters, Numbers - The Toddler Teacher", len:"30:33"},
  {id:"BOOQLQUnMas", t:"Toddler Learning - Preschool Online", len:"30:02"},
  {id:"LZES_sSMuVs", t:"Music Class for Kids Online", len:"34:22"},
  {id:"CY25TFuY8qA", t:"Preschool - Letter B, No David Read Aloud, Days of the Week", len:"30:14"},
  {id:"ZizzobSlWkg", t:"Icky Sticky Bubble Gum + More Nursery Rhymes", len:"30:16"},
  {id:"t8ifczgtldM", t:"Toddler Frozen Music Class", len:"32:53"},
  {id:"hWRH7OWKMwI", t:"Preschool Music & Movement - Number Songs, Counting, Dance", len:"31:23"},
  {id:"hs4c0YrP-h8", t:"Kids Music Class - Jammin' with Jules", len:"30:17"},
  {id:"eZ4roKAkOEg", t:"Count to 20 Song + Counting & Number Songs", len:"31:12"},
  {id:"2vYqjQnm3WY", t:"Preschool for Littles - full virtual preschool", len:"2:00:12"},
  {id:"VX2bE7y_33g", t:"Old MacDonald + other Animal Songs", len:"45:26"},
  {id:"k0qrPENQgrY", t:"5 Little Ducks and More Learning Songs", len:"1:01:06"},
  {id:"vzuo-C0hzpE", t:"Preschool for Littles - Circle Time, Songs, Movement", len:"1:06:41"},
  {id:"I4o7caGRmwk", t:"Preschool for Littles - Letter B Part 2 - Ms Rachel Visits the Beach", len:"1:08:02"},
  {id:"3Cif-tnRxjg", t:"Sink or Float - science experiment for kids", len:"1:04:05"},
  {id:"eetwPz7PHvY", t:"Preschool - Circle Time, Songs, Reading, Movement", len:"1:14:37"},
  {id:"OQ9BL6_cexw", t:"Preschool Songs - Action and Movement", len:"2:00:06"},
  {id:"mGgDKEVZXw8", t:"Banana Phone by Raffi and More Toddler Songs", len:"40:56"},
  {id:"icUL7bjce8c", t:"Preschool Learning, Activities and Songs", len:"2:02:20"},
  {id:"B7AuefmcT6A", t:"Halloween Songs for Kids - Circle Time", len:"1:19:09"},
  {id:"38io5l3Z024", t:"Kids Dance Songs - Whip Your Tail Like A Dinosaur - Brain Breaks", len:"1:04:26"},
  {id:"hJw7uWLMeC8", t:"Learn at the Playground", len:"1:04:14"},
  {id:"uLsC9aK32QA", t:"Animal Sounds - Talking Time on the Farm", len:"1:08:35"},
  {id:"noJrVwp6akE", t:"Circle Time, Phonics, Colors, Numbers - Dinosaurs", len:"1:19:35"},
  {id:"7siu3eOW1VQ", t:"Happy Birthday Song Circle Time Special", len:"1:13:10"},
  {id:"OyUoskE7Ogk", t:"Bedtime Routine - Bedtime Stories for Toddlers", len:"31:00"},
  {id:"559QxICEleA", t:"Animal Sounds, Farm Animals, Colors, Numbers, Words", len:"3:00:47"},
  {id:"az9c0l-IfgM", t:"Hop Little Bunnies + More Nursery Rhymes", len:"1:10:01"},
  {id:"_R0xRT2y7Uo", t:"Learn The Alphabet, Letters, Phonics Song", len:"1:00:18"},
  {id:"TyV-OhCrVDA", t:"Learn Colors, Fruits and Vegetables", len:"1:00:15"},
  {id:"hOHrqPI9bVk", t:"Learn Numbers, Colors, Counting and Shapes", len:"1:00:04"},
  {id:"HsT3iI6dT5U", t:"Songs for Littles Christmas Movie", len:"1:10:21"},
  {id:"47MNn4bsmSw", t:"Learn Animals - Animal Sounds, Farm Animals, Nursery Rhymes", len:"2:00:10"},
  {id:"ozsgl_sLnHQ", t:"Learn About Emotions and Feelings", len:"1:20:13"},
  {id:"bOiYN7iU-W8", t:"Wheels On The Bus + More Nursery Rhymes", len:"1:00:20"},
  {id:"yBj9Qlpwjcs", t:"Learn Words and Colors for Toddlers", len:"30:16"},
  {id:"kBuKdHQYPps", t:"Ms Rachel Halloween - Wheels on the Bus", len:"40:31"},
];
const MINS=[{s:10,l:"10 sec",t:1},{s:120,l:"2 min"},{s:180,l:"3 min"},{s:240,l:"4 min"},{s:300,l:"5 min"}];
const $=s=>document.querySelector(s);
const Q=new URLSearchParams(location.search);

// ---- deep-link params: ?m=3 (minutes) ?s=10 (seconds) ?v=random|<id> ?debug=1
const DEBUG = Q.has('debug');
function wantedSeconds(){
  if(Q.has('s')) return Math.max(3, parseInt(Q.get('s'),10)||0);
  if(Q.has('m')) return Math.max(3, (parseFloat(Q.get('m'))||0)*60);
  return null;
}
function wantedVideo(){
  const v=Q.get('v');
  if(!v) return null;
  if(v==='random'||v==='any') return VIDEOS[Math.floor(Math.random()*VIDEOS.length)];
  return VIDEOS.find(x=>x.id===v) || {id:v,t:v};
}

let chosen = wantedSeconds() || 180;
let player=null, ready=false, ticker=null, pending=null, wake=null;

function log(m){ if(!DEBUG) return; const d=$('#dbg'); d.classList.add('on');
  d.textContent=(new Date().toLocaleTimeString()+'  '+m+'\n'+d.textContent).slice(0,900); }


// ---- resume: remember where each video stopped so repeat plays continue
// rather than restarting. Wrapped because storage throws in private mode.
const PK = id => 'msrchl:pos:' + id;
function getPos(id){ try{ return parseFloat(localStorage.getItem(PK(id))) || 0; }catch(e){ return 0; } }
function setPos(id,t){ try{ localStorage.setItem(PK(id), String(Math.max(0,t))); }catch(e){} }
function fmt(t){ const m=Math.floor(t/60), sc=Math.floor(t%60); return m+':'+String(sc).padStart(2,'0'); }

// ---- countdown: off by default, tap the top-right corner to toggle.
// The corner stays tappable while hidden so it can be brought back.
let clockOn = (()=>{ try{ return Q.get('clock')==='1' || localStorage.getItem('msrchl:clock')==='1'; }catch(e){ return false; } })();
function paintClock(){ $('#clk').classList.toggle('on', clockOn); }
$('#clk').onclick = e => { e.stopPropagation(); clockOn=!clockOn;
  try{ localStorage.setItem('msrchl:clock', clockOn?'1':'0'); }catch(e){}
  paintClock(); };
paintClock();

// ---- picker UI
MINS.forEach(m=>{const b=document.createElement('button');
  b.className='chip'+(m.t?' test':'')+(m.s===chosen?' sel':'');b.textContent=m.l;
  b.onclick=()=>{chosen=m.s;[...$('#mins').children].forEach(c=>c.classList.remove('sel'));b.classList.add('sel')};
  $('#mins').appendChild(b)});
VIDEOS.forEach(v=>{const b=document.createElement('button');b.className='card';
  b.innerHTML='<img loading=lazy src="https://i.ytimg.com/vi/'+v.id+'/mqdefault.jpg" alt=""><span>'+v.t+'</span>';
  b.onclick=()=>arm(v);$('#grid').appendChild(b)});
$('#surprise').onclick=()=>arm(VIDEOS[Math.floor(Math.random()*VIDEOS.length)]);
$('#again').onclick=()=>location.reload();

// ---- pre-warm the player at load so playVideo() can run inside a real tap.
// iOS blocks playback started from an async callback; it only honours a gesture.
function onYouTubeIframeAPIReady(){
  player=new YT.Player('yt',{videoId:VIDEOS[0].id,
    playerVars:{playsinline:1,autoplay:0,controls:0,disablekb:1,fs:0,rel:0,modestbranding:1,iv_load_policy:3,cc_load_policy:0},
    events:{
      onReady:()=>{ready=true;player.mute();log('player ready');},
      onStateChange:e=>log('state '+e.data)
    }});
}
window.onYouTubeIframeAPIReady=onYouTubeIframeAPIReady;

// arm = choose a video and show the one tap iOS requires
function arm(v){
  pending=v;
  $('#pick').classList.remove('on');
  $('#tapt').textContent='Tap to start';
  const p=getPos(v.id);
  $('#taps').textContent = v.t + (p>5 ? '  \u00b7  resuming at '+fmt(p) : '');
  $('#tap').classList.add('on');
}
$('#tap').onclick=()=>{ if(pending) go(pending); };

// go() runs synchronously inside the tap. That is what makes iOS allow sound.
function go(v){
  $('#tap').classList.remove('on');
  $('#stage').classList.add('on');
  try{
    player.loadVideoById({videoId:v.id, startSeconds:getPos(v.id)});
    player.unMute();
    player.setVolume(100);
    player.playVideo();
    killCaptions();
    log('go '+v.id);
  }catch(e){ log('ERR '+e); }
  navigator.wakeLock?.request('screen').then(w=>wake=w).catch(()=>{});
  // Safety net: poll briefly for playback. States 1 (playing) and 3 (buffering)
  // both mean it took; only a sustained failure puts the tap target back.
  let waited=0;
  const probe=setInterval(()=>{
    let st=-99; try{ st=player.getPlayerState(); }catch(e){}
    waited+=300;
    if(st===1||st===3){ clearInterval(probe); log('playing (state '+st+')'); run(); return; }
    if(waited>=6000){ clearInterval(probe); log('no playback, state '+st);
      $('#stage').classList.remove('on');
      $('#tapt').textContent='Tap again to play';
      $('#tap').classList.add('on'); }
  },300);
}

function run(){
  const cur = pending;
  // If the last session left us near the end, start the next one over.
  const save = () => { try{
      const t=player.getCurrentTime(), d=player.getDuration();
      setPos(cur.id, (d && t > d-30) ? 0 : t);
    }catch(e){} };
  const end=Date.now()+chosen*1000;
  const WARN=Math.min(20,Math.max(3,chosen*0.15));
  const FADE=Math.min(6,Math.max(2,chosen*0.25));
  let warned=false,fading=false;
  clearInterval(ticker);
  ticker=setInterval(()=>{
    const left=(end-Date.now())/1000;
    if(!warned&&left<=WARN){warned=true;chime();log('chime');}
    if(!fading&&left<=FADE){fading=true;
      $('#yt').style.transitionDuration=FADE+'s';$('#yt').style.opacity=0;
      const v0=player.getVolume(),t0=Date.now();
      const vf=setInterval(()=>{const k=Math.min(1,(Date.now()-t0)/(FADE*1000));
        player.setVolume(Math.round(v0*(1-k)));if(k>=1)clearInterval(vf)},80);}
    const secsLeft=Math.max(0,Math.ceil(left));
    $('#clk').firstChild.textContent=Math.floor(secsLeft/60)+':'+String(secsLeft%60).padStart(2,'0');
    if(cur&&Math.floor(left)%5===0) save();
    if(left<=0){clearInterval(ticker); save();
      try{player.pauseVideo();player.setVolume(0)}catch(e){}
      $('#bye').classList.add('on');$('#clk').style.display='none';log('done');
      if(wake)wake.release().catch(()=>{});}
  },100);
}

function killCaptions(){
  let n=0;
  const t=setInterval(()=>{
    try{ player.unloadModule('captions'); player.unloadModule('cc'); }catch(e){}
    if(++n>=8) clearInterval(t);
  },600);
}

function chime(){try{const a=new (window.AudioContext||window.webkitAudioContext)();
  [[880,0],[660,.28]].forEach(([f,d])=>{const o=a.createOscillator(),g=a.createGain();
    o.type='sine';o.frequency.value=f;o.connect(g);g.connect(a.destination);
    const t=a.currentTime+d;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.05);
    g.gain.exponentialRampToValueAtTime(.001,t+.9);o.start(t);o.stop(t+1)})}catch(e){}}

// ---- entry: deep link goes straight to the tap target, otherwise show picker
const dl = wantedVideo();
if(dl){ arm(dl); }
else { $('#pick').classList.add('on'); }
if(DEBUG) log('params m='+Q.get('m')+' s='+Q.get('s')+' v='+Q.get('v')+' -> '+chosen+'s');
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body></html>
